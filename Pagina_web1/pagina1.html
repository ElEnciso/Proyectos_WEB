<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Promedio en JS</title>
    <link rel="stylesheet" href="../estilos/css.css">
    <link id="favicon" rel="icon" type="image/png" href="../frame3.png">
</head>
<body>

    <header>
        <h1>Ejercicio 1: JavaScript</h1>
        <p>Cálculo de Promedio</p>
    </header>

    <main class="container">
        <article class="card">
            <div class="card-header">
                <h3 class="card-title">Ejecución del Código</h3>
                <span class="card-badge">JS Básico</span>
            </div>
            <p class="card-description" style="margin-bottom: 1rem; font-weight: bold;">
                Ejercicio: Crear el código en JS para calcular un promedio.
            </p>
            <div style="background-color: #f1f5f9; padding: 1.5rem; border-radius: 6px; font-family: monospace; font-size: 1.1rem; border: 1px solid var(--border-color);">
                <script type="text/javascript">
                    document.write('Hola mundo.<br><br>');
                    document.write('Valores asignados:<br>');
                    document.write('a = 3 <br>');
                    document.write('b = 9 <br>');
                    document.write('c = 5 <br><br>');

                    var a = 3, b = 9, c = 5;
                    let suma = a + b + c;
                    let prom = suma / 3;
                    document.write('<strong>Resultado Suma = </strong>', suma, '<br>');
                    document.write('<strong style="color: var(--primary-color);">Resultado Promedio = </strong>', prom, '<br><br> ');
                </script>
            </div>
        </article>
        <div style="margin-top: 2rem;">
            <a href="index.html" class="btn" style="background-color: var(--text-secondary);">
                ⬅ Regresar
            </a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 ElEnciso WEB</p>
    </footer>
</body>
</html>
