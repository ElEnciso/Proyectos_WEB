<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ejercicio 21: Dado una secuencia de textos proporcionados por el usuario, visualizar: la longitud, en mayusculas, minúsculas, cada uno de ellas.">
    <title>Ejercicio 21: Textos en orden</title>
    <link rel="stylesheet" href="../estilos/css.css">
    <link id="favicon" rel="icon" type="image/png" href="../frame3.png">
</head>
<body>

    <header>
        <h1>Ejercicio 21: JavaScript</h1>
        <p>Textos en orden</p>
    </header>

    <main class="container">
        <article class="card">
            <div class="card-header">
                <h3 class="card-title">Ejecución del Código</h3>
                <span class="card-badge">JS Básico</span>
            </div>
            <p class="card-description" style="margin-bottom: 1rem; font-weight: bold;">
                Ejercicio: Crear el código en JS para mostrar una secuencia de textos en orden.
            </p>
            <div style="background-color: #f1f5f9; padding: 1.5rem; border-radius: 6px; font-family: monospace; font-size: 1.1rem; border: 1px solid var(--border-color);">
                <script type="text/javascript">
                    var textos = [];
                    var cantidad = parseInt(prompt("Ingrese la cantidad de textos a leer:"));

                    for (var i = 0; i < cantidad; i++) {
                        var texto = prompt("Ingrese el texto " + (i + 1) + ":");
                        textos.push(texto);
                    }

                    textos.sort();

                    document.write("<br><strong style='color: var(--primary-color);'>Los textos ingresados en orden son: </strong>" + textos.join(", "));
                </script>
            </div>
        </article>
        <div style="margin-top: 2rem;">
            <a href="index.html" class="btn" style="background-color: var(--text-secondary);">
                ⬅ Regresar
            </a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 ElEnciso WEB</p>
    </footer>
</body>
</html>
