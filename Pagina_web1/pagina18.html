<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ejercicio 18: Dado dos vectores A y B de tamaño n, calcular un arrelgo C donde la posición i de C sea la suma de A[i] + B[i].">
    <title>Ejercicio 18: Suma de elementos de dos vectores</title>
    <link rel="stylesheet" href="../estilos/css.css">
    <link id="favicon" rel="icon" type="image/png" href="../frame3.png">
</head>
<body>

    <header>
        <h1>Ejercicio 18: JavaScript</h1>
        <p>Suma de elementos de dos vectores</p>
    </header>

    <main class="container">
        <article class="card">
            <div class="card-header">
                <h3 class="card-title">Ejecución del Código</h3>
                <span class="card-badge">JS Básico</span>
            </div>
            <p class="card-description" style="margin-bottom: 1rem; font-weight: bold;">
                Ejercicio: Crear el código en JS para calcular la suma de elementos de dos vectores.
            </p>
            <div style="background-color: #f1f5f9; padding: 1.5rem; border-radius: 6px; font-family: monospace; font-size: 1.1rem; border: 1px solid var(--border-color);">
                <script type="text/javascript">
                    var a = [];
                    var b = [];
                    var n = parseInt(prompt("Ingrese el tamaño de los vectores:"));
                    for (var i = 0; i < n; i++) {
                        a[i] = parseFloat(prompt("Ingrese el elemento " + (i + 1) + " del vector A:"));
                    }
                    for (var j = 0; j < n; j++) {
                        b[j] = parseFloat(prompt("Ingrese el elemento " + (j + 1) + " del vector B:"));
                    }
                    var c = [];
                    for (var k = 0; k < n; k++) {
                        c[k] = a[k] + b[k];
                    }
                    document.write("<br><strong style='color: var(--primary-color);'>Vector A: </strong>" + a);
                    document.write("<br><strong style='color: var(--primary-color);'>Vector B: </strong>" + b);
                    document.write("<br><strong style='color: var(--primary-color);'>Vector C (A + B): </strong>" + c);
                </script>
            </div>
        </article>
        <div style="margin-top: 2rem;">
            <a href="index.html" class="btn" style="background-color: var(--text-secondary);">
                ⬅ Regresar
            </a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 ElEnciso WEB</p>
    </footer>
</body>
</html>
