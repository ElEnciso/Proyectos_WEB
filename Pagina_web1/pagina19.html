<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ejercicio 19: Calcular la media de una secuencia de números ingresados por el usuario.">
    <title>Ejercicio 19: Media de una secuencia de números</title>
    <link rel="stylesheet" href="../estilos/css.css">
    <link id="favicon" rel="icon" type="image/png" href="../frame3.png">
</head>
<body>

    <header>
        <h1>Ejercicio 19: JavaScript</h1>
        <p>Media de una secuencia de números</p>
    </header>

    <main class="container">
        <article class="card">
            <div class="card-header">
                <h3 class="card-title">Ejecución del Código</h3>
                <span class="card-badge">JS Básico</span>
            </div>
            <p class="card-description" style="margin-bottom: 1rem; font-weight: bold;">
                Ejercicio: Crear el código en JS para calcular la media de una secuencia de números.
            </p>
            <div style="background-color: #f1f5f9; padding: 1.5rem; border-radius: 6px; font-family: monospace; font-size: 1.1rem; border: 1px solid var(--border-color);">
                <script type="text/javascript">
                    var numeros = [];
                    var cantidad = parseInt(prompt("Ingrese la cantidad de números a leer:"));

                    for (var i = 0; i < cantidad; i++) {
                        var numero = parseFloat(prompt("Ingrese el número " + (i + 1) + ":"));
                        numeros.push(numero);
                    }

                    var suma = 0;
                    for (var j = 0; j < numeros.length; j++) {
                        suma += numeros[j];
                    }

                    var media = suma / cantidad;

                    document.write("<br><strong style='color: var(--primary-color);'>La media de los números ingresados es: </strong>" + media);
                </script>
            </div>
        </article>
        <div style="margin-top: 2rem;">
            <a href="index.html" class="btn" style="background-color: var(--text-secondary);">
                ⬅ Regresar
            </a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 ElEnciso WEB</p>
    </footer>
</body>
</html>
