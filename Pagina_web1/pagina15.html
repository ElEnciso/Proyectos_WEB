<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ejercicio 15: Leer un número mostrar multiplos">
    <title>Ejercicio 15: Leer un número mostrar multiplos</title>
    <link rel="stylesheet" href="../estilos/css.css">
    <link id="favicon" rel="icon" type="image/png" href="../frame3.png">
</head>
<body>

    <header>
        <h1>Ejercicio 15: JavaScript</h1>
        <p>Leer un número y mostrar sus múltiplos</p>
    </header>

    <main class="container">
        <article class="card">
            <div class="card-header">
                <h3 class="card-title">Ejecución del Código</h3>
                <span class="card-badge">JS Básico</span>
            </div>
            <p class="card-description" style="margin-bottom: 1rem; font-weight: bold;">
                Ejercicio: Crear el código en JS para calcular los múltiplos de un número ingresado por el usuario.
            </p>
            <div style="background-color: #f1f5f9; padding: 1.5rem; border-radius: 6px; font-family: monospace; font-size: 1.1rem; border: 1px solid var(--border-color);">
                <script type="text/javascript">
                    var numero = parseInt(prompt("Ingrese un número:"));
                    var multiplos = "";
                    for (var i = 1; i <= 10; i++) {
                        multiplos += numero + " x " + i + " = " + (numero * i) + "<br>";
                    }
                    document.write("<strong style='color: var(--primary-color);'>Múltiplos de " + numero + ":</strong><br>" + multiplos);
                </script>
            </div>
        </article>
        <div style="margin-top: 2rem;">
            <a href="index.html" class="btn" style="background-color: var(--text-secondary);">
                ⬅ Regresar
            </a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 ElEnciso WEB</p>
    </footer>
</body>
</html>
